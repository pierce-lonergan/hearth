name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      with_torch:
        description: "Also run the torch/transformers cross-check tests (INV-NUM-1)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Golden tests (INV-VERIFY) never run through a plain `pytest tests/golden`: conftest.py or
# __init__.py files, pytest.ini/pyproject.toml/setup.cfg/tox.ini, PYTEST_ADDOPTS, planted .pyc
# files or a sitecustomize on PYTHONPATH could skip or neutralise them, and pytest reports skips
# as success. `check_golden.py --run` verifies the hash lock and runs a temporary copy of only
# the locked files, failing on any skip.
#
# The governance tools run as checked out at the base revision (.trusted/, removed first in case the
# change brings one), with `python -I -S`: no PYTHON* variables, no current directory or script
# directory on sys.path, no site-packages and no .pth files. In the governance job they run before
# anything from the change is installed or executed (`python -I -m pip` keeps pip from importing a
# pip/ package of the change). The build jobs run the change's own build and tests before their
# golden run, and that code could tamper with .trusted/ or site-packages, so the golden run there is
# only as trustworthy as review of that code (governance/README.md, "CI").
#
# This workflow runs on `pull_request`, i.e. as the pull request has edited it; only CODEOWNERS on
# .github/ with required code-owner review stops a change from editing these steps. Whether the
# golden files may differ from the base's lock is decided by golden.yml, and the decision circuit
# breaker by decisions.yml. Those run on `pull_request_target` for pull requests into main (the
# default branch's copy of the workflow), fetch the change only as git objects, refuse paths that
# are one file on Windows or macOS, and re-run when labels change.

jobs:
  governance:
    name: governance (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]   # tools promise Python 3.9+ and the standard library only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Discard any .trusted directory the change brings
        shell: bash
        run: rm -rf .trusted
      - name: Verification tools from the base revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: .trusted
          sparse-checkout: governance/tools
          persist-credentials: false
      - name: Golden-test lock (INV-VERIFY)
        run: python -I -S .trusted/governance/tools/check_golden.py --root .
      - name: Task DAG
        run: python -I -S .trusted/governance/tools/waves.py validate --tasks governance/tasks.json
      - name: Handover manifests
        run: >
          python -I -S .trusted/governance/tools/validate_handover.py --engine builtin
          --schema governance/schemas/handover.schema.json --invariants governance/INVARIANTS.md
          --tasks governance/tasks.json governance/handovers
      - name: Decision records
        run: python -I -S .trusted/governance/tools/adr.py lint --root .
      - run: python -I -m pip install pytest
      - name: Governance tool tests (the change's own tools)
        run: python -m pytest tests/py/test_governance.py -q

  linux:
    name: linux ${{ matrix.cc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Discard any .trusted directory the change brings
        shell: bash
        run: rm -rf .trusted
      - name: Verification tools from the base revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: .trusted
          sparse-checkout: governance/tools
          persist-credentials: false
      - run: python -I -m pip install numpy pytest
      - run: echo "HEARTH_DATA=$RUNNER_TEMP/hearth-data" >> "$GITHUB_ENV"
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
      - name: Build
        run: cmake --build build -j 4
      - name: C tests
        run: ctest --test-dir build --output-on-failure
      - name: Python tests
        env:
          PYTHONPATH: python
          HEARTH_LIB: ${{ github.workspace }}/build/libhearth.so
        run: python -m pytest tests/py -q
      - name: Golden tests, isolated (INV-VERIFY)
        env:
          HEARTH_LIB: ${{ github.workspace }}/build/libhearth.so
        run: python -I -S .trusted/governance/tools/check_golden.py --root . --run

  linux-asan:
    name: linux asan+ubsan
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:strict_string_checks=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v4
      - run: echo "HEARTH_DATA=$RUNNER_TEMP/hearth-data" >> "$GITHUB_ENV"
      - name: Configure
        run: cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug -DHEARTH_ASAN=ON -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
      - name: Build
        run: cmake --build build-asan -j 4
      - name: C tests under ASan/UBSan (INV-SAFE)
        run: ctest --test-dir build-asan --output-on-failure

  windows:
    name: windows msvc
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Discard any .trusted directory the change brings
        shell: bash
        run: rm -rf .trusted
      - name: Verification tools from the base revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: .trusted
          sparse-checkout: governance/tools
          persist-credentials: false
      - run: python -I -m pip install numpy pytest
      - shell: bash
        run: echo "HEARTH_DATA=$RUNNER_TEMP/hearth-data" >> "$GITHUB_ENV"
      - name: Configure (Visual Studio generator, x64)
        # -A selects the platform of a Visual Studio generator; CMake's default on Windows
        # is the newest installed Visual Studio, so this fails loudly if that changes.
        run: cmake -S . -B build -A x64 -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: C tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Python tests
        env:
          PYTHONPATH: python
          HEARTH_LIB: ${{ github.workspace }}\build\Release\hearth.dll
        run: python -m pytest tests/py -q
      - name: Golden tests, isolated (INV-VERIFY)
        env:
          HEARTH_LIB: ${{ github.workspace }}\build\Release\hearth.dll
        run: python -I -S .trusted/governance/tools/check_golden.py --root . --run

  macos:
    name: macos arm64
    runs-on: macos-latest   # Apple silicon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Discard any .trusted directory the change brings
        shell: bash
        run: rm -rf .trusted
      - name: Verification tools from the base revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: .trusted
          sparse-checkout: governance/tools
          persist-credentials: false
      - run: python -I -m pip install numpy pytest
      - run: echo "HEARTH_DATA=$RUNNER_TEMP/hearth-data" >> "$GITHUB_ENV"
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
      - name: Build
        run: cmake --build build -j 4
      - name: C tests
        run: ctest --test-dir build --output-on-failure
      - name: Python tests
        env:
          PYTHONPATH: python
          HEARTH_LIB: ${{ github.workspace }}/build/libhearth.dylib
        run: python -m pytest tests/py -q
      - name: Golden tests, isolated (INV-VERIFY)
        env:
          HEARTH_LIB: ${{ github.workspace }}/build/libhearth.dylib
        run: python -I -S .trusted/governance/tools/check_golden.py --root . --run

  transformers-crosscheck:
    name: transformers cross-check (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.with_torch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numpy, pytest, CPU torch, transformers
        run: |
          python -I -m pip install numpy pytest safetensors tokenizers transformers
          python -I -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: echo "HEARTH_DATA=$RUNNER_TEMP/hearth-data" >> "$GITHUB_ENV"
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j 4
      - name: Python tests including the cross-checks
        env:
          PYTHONPATH: python
          HEARTH_LIB: ${{ github.workspace }}/build/libhearth.so
        run: python -m pytest tests/py -q
